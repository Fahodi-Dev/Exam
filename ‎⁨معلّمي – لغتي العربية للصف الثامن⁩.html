{u:"الوحدة الثانية · الكتابة",t:"الهمزة في أول الكلمة ووسطها وآخرها",
h:`<p>الهمزة في أول الكلمة إما <b>وصل</b> أو <b>قطع</b>.</p>
<p>رسم الهمزة المتوسطة يرتبط بأربعة أمور: <b>ضبط الهمزة، ضبط الحرف الذي قبلها، نوع الحرف الذي قبلها إذا كان حرف علة، ونوع الحرف الذي بعدها إذا كان حرف علة</b>.</p>
<p>الهمزة المتطرفة: التي في آخر الكلمة، وتُرسم وفق <b>ضبط الحرف الذي قبلها</b>.</p>`,
q:[Q("الهمزة المتطرفة هي:",["في أول الكلمة","في وسطها","في آخرها","همزة وصل"],2,"المتطرفة تقع في آخر الكلمة."),
Q("تُرسم الهمزة المتطرفة وفق:",["ضبط الحرف الذي قبلها","حركة آخر الكلمة بعدها","نوع الكلمة","طول الكلمة"],0,"ضبط الحرف الذي قبلها."),

{u:"الوحدة الثانية · الكتابة",t:"التقرير الصحفي",
h:`<p><b>التقرير الصحفي:</b> وصف تقدمه الصحيفة عن حدث مهم بلغة سهلة واضحة، تستوفي جميع التفاصيل التي تهم القرّاء، ويستهدف <b>فئة عريضة من الناس</b>، مدعّمًا بالأقوال والصور والوثائق والبيانات والإحصاءات.</p>
<div class="ex">مثال: «حماية الوحدة الوطنية أولوية ومسؤولية لا تقبل التراخي» (حول خطاب لجلالة الملك عبدالله الثاني).</div>`,
q:[Q("التقرير الصحفي يستهدف:",["فئة محددة جدًا","فئة عريضة من الناس","المختصين فقط","الأطفال فقط"],1,"كما في تعريفه."),

{u:"الوحدة الثالثة · الكتابة",t:"ألف التثنية بعد الهمزة",
h:`<p>إذا جاءت ألف التثنية بعد الهمزة المتطرفة:</p>
<div class="ex">١. على السطر إذا كان الحرف قبلها من أحرف الفصل: جزء ← <b>جزءان</b><br>٢. على نبرة إذا كان الحرف قبلها من أحرف الوصل: دفء ← <b>دفئان</b>، قارئ ← <b>قارئان</b><br>٣. تُقلب مدًّا إذا انتهت بألف مهموز: مبتدأ ← <b>مبتدآن</b>، ملجأ ← <b>ملجآن</b></div>`,
q:[Q("مثنى «جزء»:",["جزأان","جزءان","جزئان","جزآن"],1,"الزاي من أحرف الفصل فتكتب الهمزة على السطر."),
Q("مثنى «دفء»:",["دفءان","دفئان","دفآن","دفأان"],1,"الفاء حرف وصل فتكتب على نبرة."),
Q("مثنى «مبتدأ»:",["مبتدأان","مبتدآن","مبتدئان","مبتدءان"],1,"تقلب مدًّا لأنها انتهت بألف مهموز.")]},
{u:"الوحدة الثالثة · الكتابة",t:"القصة القصيرة",
h:`<p><b>القصة:</b> نوع من القول النثري ينقل حدثًا أو أحداثًا تجري في مكان وزمان ما، وتتعلق بشخصيات رئيسة وثانوية، وتنتظم أحداثها <b>عقدة وحلًّا (لحظة تنوير)</b>، ولها مغزى وهدف يحاول الكاتب إيصاله للقارئ.</p>
<div class="ex">١. <b>الزمان:</b> المدة الزمنية التي تجري فيها الأحداث.<br>٢. <b>المكان:</b> الفضاء الجغرافي للأحداث.<br>٣. <b>الحدث:</b> مجموعة المواقف التي تمر بها الشخصيات وتتأثر بها.<br>٤. <b>الشخصيات:</b> العناصر التي تقوم بالأدوار، رئيسة وثانوية.<br>٥. <b>العقدة:</b> تشابك الأحداث لتصل إلى ذروة التأزّم.<br>٦. <b>الحل:</b> لحظة التنوير، ينقل القارئ إلى نهاية القصة.</div>
<p>عند الكتابة: أحدد الموضوع والمغزى، أختار عنوانًا مناسبًا وموجزًا، أوظف التشويق، أراعي تسلسل الأحداث ومنطقيتها، وأوظف علامات الترقيم توظيفًا صحيحًا. (مثال الكتاب: قصة «باب الواد» لمجدولين أبو الرب)</p>`,
q:[Q("لحظة التنوير هي:",["بداية القصة","الحل","العقدة","العنوان"],1,"الحل هو لحظة التنوير."),
Q("تشابك الأحداث حتى ذروة التأزم يسمى:",["الحل","الزمان","العقدة","المغزى"],2,"هذه العقدة."),
Q("المكان في القصة هو:",["المدة الزمنية","الفضاء الجغرافي","الأشخاص","النهاية"],1,"المكان: الفضاء الجغرافي."),
Q("الشخصيات في القصة تنقسم إلى:",["أولى وأخيرة","رئيسة وثانوية","حقيقية فقط","خيالية فقط"],1,"رئيسة وثانوية.")]}

Q("«هؤلاء طلابٌ مجتهدون»: المبتدأ:",["اسم إشارة","اسم ظاهر","ضمير","مصدر مؤوّل"],0,"هؤلاء اسم إشارة."),

Q("إعراب «الوطنُ» في «الوطنُ غالٍ»:",["مبتدأ مرفوع وعلامة رفعه الضمة","مبني في محل رفع","خبر مرفوع","فاعل"],0,"اسم ظاهر معرب."),
Q("إعراب «هذا» في «هذا كتابٌ»:",["مبتدأ مرفوع بالضمة","اسم إشارة مبني في محل رفع مبتدأ","خبر","مفعول به"],1,"اسم الإشارة مبني."),

Q("«الطالبُ علمُه غزيرٌ»: الخبر:",["جملة اسمية","جملة فعلية","مفرد","ظرف"],0,"علمه غزير: مبتدأ وخبر."),

Q("«الكتابُ فوقَ الطاولةِ»: الخبر:",["جار ومجرور","مفرد","ظرف","جملة اسمية"],2,"فوق ظرف مكان."),
Q("إعراب «جميلةٌ» في «الحديقةُ جميلةٌ»:",["خبر مرفوع وعلامة رفعه الضمة","خبر في محل رفع","مبتدأ","نعت"],0,"الخبر المفرد مرفوع."),
Q("إعراب «تلك أمةٌ قد خلت»: «أمةٌ»:",["مبتدأ","خبر مرفوع وعلامة رفعه الضمة","فاعل","مفعول به"],1,"تلك مبتدأ وأمة خبر."),
Q("«الأردنُ نعتزُّ به»: الضمير العائد على المبتدأ:",["نا الفاعل","الهاء في به","الباء","لا يوجد"],1,"الهاء تعود على الأردن."),
Q("شبه الجملة يشمل:",["الفعل والفاعل","الظرف والجار والمجرور","المبتدأ والخبر","الاسم المفرد"],1,"ظرف أو جار ومجرور."));
S.find(s=>s.t=="همزتا الوصل والقطع").q.push(Q("«ابنة»: همزتها:",["قطع","وصل","متطرفة","مدّ"],1,"ابن وابنة واسم همزتها وصل."),
Q("«أخوك»: همزتها:",["وصل","قطع","لا همزة","متوسطة"],1,"أخو من الأسماء المبدوءة بهمزة قطع."));
S.splice(0,S.length,...[4,5,10,2,8,11,3,9,12,0,1,6,7].map(k=>S[k]));
let i=-1,ans=S.map(s=>s.q.map(()=>null));
const m=document.getElementById('m'),pb=document.getElementById('pb');
const tot=()=>ans.flat().filter(x=>x!==null).length,all=ans.flat().length;
function draw(){pb.style.width=(tot()/all*100)+'%';
if(i<0){m.innerHTML=`<div class="card teach"><h2>أهلًا فيك 👋</h2><p>أنا معلّمك. رح أشرح لك كل قاعدة من الوحدتين ١ و٢ ومن الدرس الرابع في الوحدة ٣، وبعد كل شرح بسألك أسئلة، وبصحّح لك وبقيّم مستواك في النهاية.</p><p class="tag">الوحدتان ١ و٢ كل دروسهما، والوحدة ٣ الدرس الرابع (أكتب) فقط.</p></div><button class="go" onclick="i=0;draw()">يلّا نبلّش</button>`;return}
if(i>=S.length){rep();return}
const s=S[i];
m.innerHTML=`<div class="card teach"><div class="tag">${s.u} · ${i+1} من ${S.length}</div><h2>${s.t}</h2>${s.h}</div>`+
s.q.map((q,k)=>`<div class="card"><b>${k+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button class="opt" id="o${k}_${j}" onclick="pick(${k},${j})">${o}</button>`).join('')}<div class="fb" id="f${k}"></div></div>`).join('')+
`<div class="row">${i?'<button class="go alt" onclick="i--;draw()">السابق</button>':''}<button class="go" onclick="i++;draw();scrollTo(0,0)">${i==S.length-1?'شوف تقييمي':'الدرس التالي'}</button></div>`;
ans[i].forEach((a,k)=>{if(a!==null)mark(k,a.j,false)});}
function pick(k,j){if(ans[i][k]!==null)return;ans[i][k]={j,c:j===S[i].q[k][2]};mark(k,j,true);pb.style.width=(tot()/all*100)+'%'}
function mark(k,j,f){const q=S[i].q[k],c=q[2];document.getElementById('o'+k+'_'+c).classList.add('ok');
if(j!==c)document.getElementById('o'+k+'_'+j).classList.add('no');
const fb=document.getElementById('f'+k);fb.className='fb '+(j===c?'ok':'no');fb.textContent=(j===c?'أحسنت! ':'غلط، الصح الخيار المظلل. ')+q[3]}
function rep(){let c=0;const rows=S.map((s,x)=>{const k=ans[x].filter(a=>a&&a.c).length;c+=k;return `<div class="sc"><span>${s.t}</span><b>${k} / ${s.q.length}</b></div>`}).join('');
const p=Math.round(c/all*100);
const weak=S.filter((s,x)=>ans[x].filter(a=>a&&a.c).length<s.q.length*0.7).map(s=>s.t);
const msg=p>=85?'ممتاز! أنت جاهز للامتحان.':p>=60?'مستواك جيد، بس بدك تراجع الدروس تحت.':'لازم تعيد الشرح وتحلّ مرة ثانية.';
m.innerHTML=`<div class="card teach"><h2>تقييمك: ${p}%</h2><p>${msg}</p>${rows}${weak.length?`<p><b>راجع:</b> ${weak.join('، ')}</p>`:''}<p class="tag">الأسئلة التي لم تجب عنها تُحسب خطأ.</p></div><div class="row"><button class="go" onclick="ans=S.map(s=>s.q.map(()=>null));i=0;draw()">أعيد من البداية</button></div>`}
draw();
</script></body></html>
